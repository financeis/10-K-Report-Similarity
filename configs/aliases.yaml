# 10-K 본문에서 회사 이름을 찾을 때 쓰는 사전 (tenksim mentions).
#
# 기본 이름은 기업 목록의 회사명에서 Inc. 같은 접미사를 떼어 자동으로 만듭니다.
# 이 파일은 자동으로 못 만드는 이름을 보탭니다. 사람이 직접 고치는 파일입니다.
#
# - names:    정식 이름, 흔히 쓰는 줄임말. 대소문자를 구분합니다.
# - products: 제품·자회사 이름. 인수·분사로 소속이 바뀌므로 적용 기간(since/until,
#             회계연도)을 적을 수 있습니다. 비우면 기간 제한이 없습니다.
# - 자동 이름이 일반 단어(아래 generic_words)라서 빠진 회사는 names에 정식 명칭을 적어 주세요.
#   예: Target → "Target Corporation"

# 티커 ON처럼 YAML이 참·거짓으로 읽는 키는 따옴표로 감쌉니다.
companies:
  AAPL: {names: [Apple]}
  AMZN:
    names: [Amazon, Amazon.com]
    products: [{name: Amazon Web Services}, {name: AWS}]
  MSFT:
    names: [Microsoft]
    products: [{name: Microsoft Azure}, {name: LinkedIn, since: 2016}, {name: GitHub, since: 2018}, {name: Activision Blizzard, since: 2024}]
  GOOGL:
    names: [Google, Alphabet]
    products: [{name: YouTube}, {name: Google Cloud}, {name: Android}]
  META:
    names: [Meta Platforms, Facebook]
    products: [{name: Instagram}, {name: WhatsApp}]
  NVDA: {names: [NVIDIA, Nvidia]}
