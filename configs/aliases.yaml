  GEV: {since: 2024}    # GE Vernova, 2024-04 GE에서 분사
  SOLV: {since: 2024}   # Solventum, 2024-04 3M에서 분사
  SW: {since: 2024}     # Smurfit Westrock, 2024-07 합병 출범
  SNDK: {since: 2025}   # Sandisk, 2025-02 Western Digital에서 분사
  Q: {since: 2025}      # Qnity Electronics, DuPont 전자 사업 분사
  HONA: {since: 2026}   # Honeywell Aerospace, Honeywell에서 분사
  FDXF: {since: 2026}   # FedEx Freight, FedEx에서 분사

# 분석 대상 밖 회사 (시범). 3단계에서 SEC 전체 등록사 이름으로 넓힙니다.
# id: 20-F 등 SEC에 공시하는 회사는 cik:<번호>, 아니면 ext:<이름>
external:
  - {id: "cik:1046179", name: Taiwan Semiconductor Manufacturing, names: [Taiwan Semiconductor Manufacturing, TSMC]}
  - {id: "ext:samsung-electronics", name: Samsung Electronics, names: [Samsung Electronics, Samsung]}
  - {id: "ext:sk-hynix", name: SK hynix, names: [SK hynix, SK Hynix]}
  - {id: "ext:hon-hai", name: Hon Hai Precision (Foxconn), names: [Hon Hai, Foxconn]}
  - {id: "cik:937966", name: ASML Holding, names: [ASML]}
  - {id: "ext:huawei", name: Huawei, names: [Huawei]}
  - {id: "cik:1577552", name: Alibaba Group, names: [Alibaba]}
  - {id: "cik:313838", name: Sony Group, names: [Sony]}
  - {id: "cik:1094517", name: Toyota Motor, names: [Toyota]}
  - {id: "ext:arm-holdings", name: Arm Holdings, names: [Arm Holdings, Arm Limited]}
  - {id: "ext:xiaomi", name: Xiaomi, names: [Xiaomi]}
  - {id: "ext:mediatek", name: MediaTek, names: [MediaTek]}

# 이 단어만으로는 회사라고 보기 어려워 자동 이름에서 뺍니다.
# 이런 회사는 위 companies에 정식 명칭을 적어야 잡힙니다.
generic_words: [
  American, General, United, Texas, Southern, Public, Global, First, Digital, International,
  National, Target, Ball, Block, Carrier, Delta, Waters, Pool, Progressive, Mosaic, Match, Fox,
  News, Equity, Extra, Host, Iron, Live, Marathon, Simon, Williams, Union, Quest, Royal, State,
  Steel, Super, West, Regency, Realty, Principal, Republic, Universal, Consolidated, Edison, Arch,
  Martin, Stanley, Tractor, Northern, Old, Advanced, Applied, Analog, Genuine, Monster, Hartford,
  Cooper, Dover, Travelers, Constellation, Honeywell, Amcor, Everest, Expand, Flex, Casey,
  Masco, Paramount, Ventas, Welltower
]

# 관계와 상관없는 문맥의 언급은 뺍니다 (이름 단위로 통째 빼지 않고 문장 문맥으로).
# tickers를 비우면 모든 회사에 적용합니다. pattern은 근거 문장에서 찾는 정규식입니다(대소문자 무시).
exclude_contexts:
  - reason: listing
    tickers: [NDAQ, ICE, CBOE]
    pattern: '(?:listed|traded|trades|quoted) on (?:the )?(?:Nasdaq|NASDAQ|New York Stock Exchange|NYSE|Cboe)|Nasdaq (?:Global|Stock Market|Capital Market)|under the (?:symbol|ticker)'
  - reason: index
    tickers: [SPGI, MSCI, NDAQ]
    pattern: 'S&P (?:500|400|600|MidCap|SmallCap)|(?:MSCI|Nasdaq(?:-100)?|Russell) [\w\- ]{0,30}Index|index (?:provider|fund)'
  - reason: credit_rating
    tickers: [SPGI, MCO]
    pattern: '\brat(?:ing|ings|ed)\b|downgrad|upgrad|investment[- ]grade|credit outlook'
  - reason: other_meaning
    tickers: [UPS]
    pattern: 'uninterruptible|power suppl|UPS (?:systems?|units?|products?)'
  - reason: other_company
    tickers: [MRK]
    pattern: 'Merck KGaA|EMD Serono'
  - reason: trademark
    tickers: []
    pattern: '(?:is|are) (?:a |the )?(?:registered )?trademarks? (?:of|owned by)|trademarks? of [A-Z]'
  - reason: performance_graph
    tickers: []
    pattern: 'performance graph|peer group|cumulative total (?:shareholder|stockholder) return'
