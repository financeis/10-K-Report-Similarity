# S&P 500 전체, 2024년에 제출된 10-K.
# 참고 논문(Vamvourellis et al., 2023) Table 1과 같은 형태의 비교 실험입니다.
# 수익률 검증 구간(2025년)은 공시가 모두 나온 뒤라서 미래 정보가 섞이지 않습니다.
#
# 소요 시간(8코어 노트북 CPU 실측): 수집 10분, 임베딩 45분(OpenAI 2종 6분 포함), 평가 1분.
# 중간에 끊겨도 같은 명령을 다시 실행하면 받아 둔 10-K와 계산한 임베딩은 건너뜁니다.
name: sp500_2024

universe:
  source: sp500_wikipedia
  # 위키피디아 표의 CIK는 '현재' 값이라, 그 사이 지주회사 전환 등으로 CIK가 바뀐 회사는
  # 2024년 10-K를 못 찾습니다(리포트의 no_filing). 확인되는 대로 당시 CIK를 적어 주세요.
  # 2024년에 아직 상장 전이던 회사(GEV, SOLV, RDDT, SW 등)는 고칠 수 없어 no_filing으로 남습니다.
  cik_overrides:
    XOM: 34088    # 2026년 ExxonMobil Holdings Corp(2115436)로 지주회사 전환
    BLK: 1364742  # 2024년 GIP 인수 때 새 지주회사(2012383) 설립, 옛 법인은 BlackRock Finance
    PSKY: 813828  # 2025년 Skydance 합병 전 Paramount Global(PARA)

filings:
  year: 2024
  sections: [business, risk_factors]
  workers: 4

methods:
  # 단어 빈도 기준선. 이걸 못 넘는 임베딩은 쓸 이유가 없습니다.
  - name: tfidf
    kind: tfidf

  # 참고 논문의 SBERT-PT와 같은 설정: all-mpnet-base-v2, Item 1 앞 1536 토큰.
  # (doc_tokens를 지우면 Item 1 전체를 씁니다. 청크가 약 8배로 늘어 CPU에서 1시간 반쯤 걸립니다.)
  - name: mpnet-1536
    kind: sbert
    model: sentence-transformers/all-mpnet-base-v2
    doc_tokens: 1536

  # 작고 빠른 모델로 Item 1 전체.
  - name: minilm
    kind: sbert
    model: sentence-transformers/all-MiniLM-L6-v2

  # 같은 모델로 Item 1A(리스크 요인) 전체. '사업' 유사도와 '리스크 공시' 유사도를 비교합니다.
  - name: minilm-risk
    kind: sbert
    model: sentence-transformers/all-MiniLM-L6-v2
    section: risk_factors

  # 유료 모델 비교 (.env의 OPENAI_API_KEY 필요). 키가 없으면 이 항목을 주석 처리하세요.
  # 임베딩한 토큰 수가 data/runs/sp500_2024/methods/openai-3-large/meta.json에 남으니 비용을 확인할 수 있습니다.
  - name: openai-3-large
    kind: openai
    model: text-embedding-3-large

  # 같은 모델을 mpnet-1536과 같은 조건(짧은 청크, 앞 1536 토큰)으로. 위 설정은 청크가 최대 8천 토큰이라
  # 긴 입력 하나를 벡터 하나로 뭉개는데, 그게 성능을 떨어뜨리는지 확인하기 위한 대조군입니다.
  - name: openai-3-large-1536
    kind: openai
    model: text-embedding-3-large
    max_tokens: 384
    doc_tokens: 1536

# 척도가 다른 유사도를 기업쌍 백분위로 바꿔 평균낸 조합. 두 방법이 서로 다른 이웃을 찾는다면(리포트 5장)
# 합쳤을 때 나아질 수 있습니다.
ensembles:
  - name: tfidf-openai
    members: [tfidf, openai-3-large-1536+center]
  - name: tfidf-minilm   # 무료 방법만으로 만든 조합
    members: [tfidf, minilm+center]

evaluation:
  k: [1, 5, 10]
  labels: [gics_sector, gics_sub_industry, sic2, sic3]
  returns:
    start: 2025-01-01
    end: 2025-12-31
    # 시장 요인: 유니버스 동일가중(자기 제외). SPY 같은 시가총액 가중 지수는
    # 대형주끼리의 잔차 상관을 음(-)으로 치우치게 합니다 (예: Apple-Microsoft -0.09 → +0.19).
    market: equal_weight
